<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>

    <!-- BLUE BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39B1F5"/>
      <stop offset="55%" stop-color="#269FEA"/>
      <stop offset="100%" stop-color="#168DDA"/>
    </linearGradient>

    <!-- WHITE -->
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F6F8"/>
    </linearGradient>

    <!-- SHADOW -->
    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="0"
        dy="9"
        stdDeviation="7"
        flood-color="#000000"
        flood-opacity=".42"
      />
    </filter>

  <!-- BACKGROUND -->

  <rect
    width="512"
    height="512"
    fill="url(#bg)"
  />


  <!-- LOGO -->

  <g
    fill="url(#white)"
    stroke="#888888"
    stroke-width="3"
    stroke-linejoin="miter"
    stroke-linecap="square"
    filter="url(#shadow)"
    mask="url(#centerCut)"
  >

    <!-- 0 -->

    <path
      fill-rule="evenodd"
      d="
        M105 135
        H285
        V377
        H105
        Z

        M155 180
        V332
        H235
        V180
        Z
      "
    />


    <!-- 1 -->

    <path
      d="
        M350 135
        H410
        V377
        H355
        V190
        H325
        V135
        Z
      "
    />

  </g>

</svg>
