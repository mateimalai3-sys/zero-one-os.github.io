<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>

    <!-- WHITE FRONT -->
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#DCE5EA"/>
    </linearGradient>

    <!-- 3D SIDE -->
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8C2C8"/>
      <stop offset="100%" stop-color="#65727A"/>
    </linearGradient>

    <!-- SHADOW -->
    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="8"
        flood-color="#003B62"
        flood-opacity=".50"
      />
    </filter>

  </defs>


  <!-- ========================= -->
  <!-- BLUE BACKGROUND -->
  <!-- ========================= -->

  <rect
    width="512"
    height="512"
    fill="#269FEA"
  />


  <!-- ========================= -->
  <!-- 3D BACK / EXTRUSION -->
  <!-- ========================= -->

  <g
    fill="url(#side)"
    stroke="#65727A"
    stroke-width="3"
    stroke-linejoin="miter"
  >

    <!-- 0 -->

    <path
      fill-rule="evenodd"
      d="
        M105 145
        H285
        V387
        H105
        Z

        M155 190
        V342
        H235
        V190
        Z
      "
    />

    <!-- 1 -->

    <path
      d="
        M350 145
        H410
        V387
        H355
        V200
        H325
        V145
        Z
      "
    />

  </g>


  <!-- ========================= -->
  <!-- FRONT 01 -->
  <!-- ========================= -->

  <g
    fill="url(#front)"
    stroke="#89959C"
    stroke-width="3"
    stroke-linejoin="miter"
    stroke-linecap="square"
    filter="url(#shadow)"
  >

    <!-- 0 -->

    <path
      fill-rule="evenodd"
      d="
        M105 135
        H285
        V377
        H105
        Z

        M155 180
        V332
        H235
        V180
        Z
      "
    />

    <!-- 1 -->

    <path
      d="
        M350 135
        H410
        V377
        H355
        V190
        H325
        V135
        Z
      "
    />

  </g>


  <!-- CENTER LINE LIGHT -->

  <rect
    x="100"
    y="247"
    width="315"
    height="4"
    fill="#55C7FF"
    opacity=".85"
  />


  <!-- ========================= -->
  <!-- TOP HIGHLIGHTS -->
  <!-- ========================= -->

  <path
    d="M112 140 H278"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="square"
    opacity=".65"
  />

  <path
    d="M357 140 H404"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="square"
    opacity=".65"
  />

</svg>
